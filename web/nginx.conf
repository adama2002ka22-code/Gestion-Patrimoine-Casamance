server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/patrimoines { proxy_pass http://ms-patrimoine:3001; }
    location /api/circuits    { proxy_pass http://ms-circuit:3002; }
    location /api/evenements  { proxy_pass http://ms-evenement:3003; }
    location /api/reservations { proxy_pass http://ms-reservation:3004; }
}